<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>୨ৎ cuttings જ⁀➴ loops ༄</title>
<link rel="stylesheet" href="mood.css?v=20261119o">
</head>
<body>

<!-- the page background; hovering a garden card previews that garden's season settings here -->
<div class="gardenbg" id="gardenBg"><svg id="previewLayer" aria-hidden="true"></svg></div>

<!-- every garden, named by its "feels like" tags — cards float straight on the background -->
<main class="gardenindex">
  <p class="gardenstatus" id="gardenStatus">gathering the gardens...</p>
  <div id="gardenList"></div>
</main>

<!-- bottom bar: a welcome message drifting by, and the new-season button kept static at the right -->
<div class="bottombar">
  <div class="marquee" id="tagMarquee"><div class="marqueetrack" id="tagMarqueeTrack"></div></div>
  <button type="button" class="easteregg" id="newGardenBtn">if it feels like a new season...</button>
</div>

<script type="module">
/* ୨ৎ ˖᯽ ݁˖ જ ˚ ༘♡ ⋆｡˚ ੈ✩‧₊˚⋆˚❀ ༉ ‧₊˚.୨ৎ ˖᯽ ݁˖ જ ˚ ༘♡ ⋆｡˚ ੈ✩‧₊˚⋆˚❀ ༉ ‧₊˚.
   GARDEN INDEX — css "garden index"
   ୨ৎ ˖᯽ ݁˖ જ ˚ ༘♡ ⋆｡˚ ੈ✩‧₊˚⋆˚❀ ༉ ‧₊˚.୨ৎ ˖᯽ ݁˖ જ ˚ ༘♡ ⋆｡˚ ੈ✩‧₊˚⋆˚❀ ༉ ‧₊˚. */

import { playhtml } from "https://unpkg.com/playhtml";
import { fetchGardens, fetchHereNow, startNewGarden, gardenUrl } from "./gardens.js?v=20261119o";
import { FIELD_W, FIELD_H, drawFieldPattern } from "./field.js?v=20261119o";

const gardenListEl = document.getElementById("gardenList");
const indexEl = document.querySelector("main.gardenindex");
const gardenStatusEl = document.getElementById("gardenStatus");
const newGardenBtn = document.getElementById("newGardenBtn");
// the cards are made after the list arrives, so playhtml is started first and
// then told about them (setupPlayElements) once they exist
const playhtmlReady = playhtml.init().catch(err => console.warn("playhtml didn't start — cards won't be draggable:", err));
const bgEl = document.getElementById("gardenBg");
const previewSvg = document.getElementById("previewLayer");

// hovering (or keyboard-focusing) a card shows that garden's season settings
// behind the window: its sky/soil gradient and its field pattern, drawn by the
// same code the garden itself uses. gardens that haven't reported settings yet
// have nothing to preview, so the background just stays as it is
function showPreview(settings){
  if(!settings) return;
  const { colors, pattern, scale } = settings;
  bgEl.style.setProperty("--sky", colors.background[0]);
  bgEl.style.setProperty("--soil", colors.background[1]);
  // crop the pattern down to the window's own size, so it's about as large here
  // as it is inside the garden. on a screen bigger than the garden's field the
  // pattern is drawn over a bigger area, so it still reaches every edge
  const w = window.innerWidth, h = window.innerHeight;
  const areaW = Math.max(FIELD_W, w), areaH = Math.max(FIELD_H, h);
  previewSvg.setAttribute("viewBox", `${(areaW - w) / 2} ${(areaH - h) / 2} ${w} ${h}`);
  previewSvg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  drawFieldPattern(previewSvg, { pattern, scale: scale || 1, seed: colors.seed, width: areaW, height: areaH });
  // the bottom bar's lettering sits straight on the page, so it follows the page's brightness
  const mid = midColor(colors.background[0], colors.background[1]);
  document.body.style.setProperty("--barink", contrast(mid, "#000000") >= contrast(mid, "#ffffff") ? "#000000" : "#ffffff");
  bgEl.classList.add("previewing");
}

function clearPreview(){
  bgEl.style.removeProperty("--sky");
  bgEl.style.removeProperty("--soil");
  document.body.style.removeProperty("--barink");
  bgEl.classList.remove("previewing");   // the pattern fades out; it's cleared on the next preview
}

// the card's window is the garden's sky fading into its soil, with a plain
// black-and-white menu bar on top; tags are white and glow in its seed color on hover

// contrast ratio between two "#rrggbb" colors. the card's lettering is black or
// white, whichever reads better against the middle of its sky-to-soil fade, and a
// garden's own text color is only used for the "here now" label when it can be read
function midColor(a, b){
  return "#" + [1, 3, 5].map(i =>
    Math.round((parseInt(a.slice(i, i + 2), 16) + parseInt(b.slice(i, i + 2), 16)) / 2).toString(16).padStart(2, "0")
  ).join("");
}
function luminance(hex){
  const [r, g, b] = [1, 3, 5].map(i => {
    const c = parseInt(hex.slice(i, i + 2), 16) / 255;
    return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4;
  });
  return .2126 * r + .7152 * g + .0722 * b;
}
function contrast(a, b){
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + .05) / (lo + .05);
}

// a copy of a list in random order (Fisher–Yates)
function shuffled(list){
  const copy = [...list];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// a plant's strokes as an <svg>, same size and line style as in the garden; the
// points are numbers from the Worker, set as attributes (never as markup)
function makePlantDrawing(d){
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "plantdrawing");
  svg.setAttribute("viewBox", `0 0 ${d.w} ${d.h}`);
  svg.setAttribute("width", d.w);    // the garden draws a plant at its canvas size (140 x 140)
  svg.setAttribute("height", d.h);
  svg.setAttribute("aria-hidden", "true");
  for(const stroke of d.paths){
    const line = document.createElementNS(NS, "polyline");
    line.setAttribute("points", stroke.map(([x, y]) => `${x},${y}`).join(" "));
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", d.color);
    line.setAttribute("stroke-width", "1.5");   // the same line style as renderPlantSlots in water.js
    line.setAttribute("stroke-linecap", "butt");
    line.setAttribute("stroke-linejoin", "miter");
    line.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(line);
  }
  return svg;
}

// a tag chip; --glow is the garden's seed color, used for the hover glow
function makeChip(text, g){
  const chip = document.createElement("span");
  chip.className = "tag";
  chip.textContent = text;
  if(g.settings) chip.style.setProperty("--glow", g.settings.colors.seed);
  return chip;
}

// the message scrolling along the bottom. it's repeated until one run is at least
// as wide as the bar, then that run is laid out twice, so sliding it by exactly
// half its width loops with no seam
const MARQUEE_TEXT = "welcome to the sound garden multiverse ୨ৎ wander around જ⁀➴ smell the sounds ༄ feel the grass ✩‧₊ hope u like it (˶ᵔ ᵕ ᵔ˶) ‹𝟹";
const MARQUEE_PX_PER_SECOND = 50;
function startMarquee(){
  const marquee = document.getElementById("tagMarquee");
  const track = document.getElementById("tagMarqueeTrack");
  const addRun = () => {
    const item = document.createElement("span");
    item.textContent = MARQUEE_TEXT;
    track.appendChild(item);
    return item;
  };
  track.innerHTML = "";
  let runs = 1;
  addRun();
  while(track.scrollWidth < marquee.clientWidth && runs < 20){ addRun(); runs++; }
  const halfWidth = track.scrollWidth;
  for(let i = 0; i < runs; i++){
    const copy = addRun();
    copy.setAttribute("aria-hidden", "true");   // the second run is only there for the loop
  }
  track.style.animationDuration = halfWidth / MARQUEE_PX_PER_SECOND + "s";
}
let marqueeWidth = 0;
window.addEventListener("resize", () => {
  const w = document.getElementById("tagMarquee").clientWidth;
  if(Math.abs(w - marqueeWidth) > 40){ marqueeWidth = w; startMarquee(); }
});

function hereNowText(n){
  return n > 0 ? `${n} here now` : "no one here now";
}

// three card sizes by how full a garden is: the plain vertical card for a
// garden with nothing in it yet, a horizontal one once it has seeds or a few
// plants, and a larger horizontal one for a garden with more than 6 plants
// (5 and 6 plants fall in between, so they stay the medium size)
function cardSize(g){
  if(g.plants > 6) return "large";
  if(g.plants > 0 || g.seeds > 0) return "medium";
  return "small";
}

// one dialog-box card per garden: its tags as the title, and the names of
// whoever planted in it. built with textContent, never innerHTML, since tags and
// names are typed in by visitors. can-move + a stable id makes each card
// draggable and its position shared live between visitors (playhtml)
function renderGardens(gardens){
  gardenListEl.innerHTML = "";
  for(const g of gardens){
    const card = document.createElement("a");
    card.className = `gardencard ${cardSize(g)}`;
    card.id = `gardencard-${g.id}`;
    card.setAttribute("can-move", "");
    card.draggable = false;   // the browser's own link-drag would fight the card drag
    card.href = gardenUrl(g.id);
    let mid = "#ffffff";
    if(g.settings){
      const [sky, soil] = g.settings.colors.background;
      mid = midColor(sky, soil);
      const ink = contrast(mid, "#000000") >= contrast(mid, "#ffffff") ? "#000000" : "#ffffff";
      card.style.background = `linear-gradient(to bottom, ${sky}, ${soil})`;
      card.style.setProperty("--ink", ink);
      card.style.setProperty("--muted", ink === "#000000" ? "#333333" : "#e6e6e6");
    }
    card.addEventListener("pointerenter", () => showPreview(g.settings));
    card.addEventListener("pointerleave", clearPreview);
    card.addEventListener("focus", () => showPreview(g.settings));
    card.addEventListener("blur", clearPreview);

    // a drag ends in a click on the link — only let a real click through
    let downAt = null;
    card.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
    card.addEventListener("click", e => {
      if(downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) e.preventDefault();
    });

    const bar = document.createElement("div");
    bar.className = "titlebar";
    const closebox = document.createElement("span");
    closebox.className = "closebox";
    bar.appendChild(closebox);

    const body = document.createElement("div");
    body.className = "cardbody";

    const name = document.createElement("div");
    name.className = "tagbank";
    if(g.tags.length){
      for(const t of g.tags) name.appendChild(makeChip(t, g));
    } else {
      const none = document.createElement("span");
      none.className = "sub";
      none.style.margin = "0";
      none.textContent = "no feels yet";
      name.appendChild(none);
    }

    const planters = document.createElement("div");
    planters.className = "planters";
    const label = document.createElement("span");
    label.className = "planterlabel";
    label.textContent = "planted by";
    const names = document.createElement("span");
    names.textContent = g.contributors.length ? g.contributors.join(", ") : "just grass...";

    planters.append(label, names);

    // live count, refreshed in place by refreshHereNow() so dragged cards stay put
    const here = document.createElement("div");
    here.className = "herenow";
    const dot = document.createElement("span");
    dot.className = "dot";
    const hereText = document.createElement("span");
    hereText.textContent = hereNowText(g.here);
    here.append(dot, hereText);
    here.dataset.here = g.here;
    if(g.settings){
      // dot in the garden's seed color, label in its text color — the same
      // pairing the garden itself uses, whether someone's there or not
      here.style.setProperty("--dot", g.settings.colors.seed);
      here.style.setProperty("--label", g.settings.colors.text);
    }

    // who planted and who's here travel together, so a layout can put them as one block
    const info = document.createElement("div");
    info.className = "cardinfo";
    info.append(planters, here);

    body.append(name, info);

    // a medium card shows one of the garden's plant drawings, a large card two, chosen at random —
    // each in the plant's own color and at the size it's drawn out in the garden
    const showDrawings = ({ medium: 1, large: 2 })[cardSize(g)] || 0;
    const drawings = shuffled(g.plantDrawings).slice(0, showDrawings);   // a different pick every time the index loads
    if(drawings.length){
      const holder = document.createElement("div");
      holder.className = "plantdrawings";
      for(const d of drawings) holder.appendChild(makePlantDrawing(d));
      body.appendChild(holder);
      card.classList.add("hasdrawing");
    }

    card.append(bar, body);
    gardenListEl.appendChild(card);
  }
  layoutCards();
}

// scatter the cards across a wide canvas that scrolls sideways. each lands in a
// column, nudged by a pseudo-random offset that comes only from the garden's id —
// so everyone starts from the same arrangement, and dragging (which playhtml syncs
// as an offset from here) moves them from there
function seededRandom(seed){
  let a = (seed + 1) * 2654435761 >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const RIGHT_BUFFER = 200;   // px of empty space after the furthest card

function layoutCards(){
  const cards = [...gardenListEl.children];
  if(!cards.length) return;
  const gap = 28;
  const areaH = baseHeight();

  // cards come in different sizes, so they're dealt out in columns, top to bottom,
  // starting a new column to the right when the next one won't fit
  const cols = [];
  let col = null;
  for(const card of cards){
    const h = card.offsetHeight;
    if(!col || col.height + gap + h > areaH){
      col = { cards: [], width: 0, height: -gap };
      cols.push(col);
    }
    col.cards.push(card);
    col.height += gap + h;
    col.width = Math.max(col.width, card.offsetWidth);
  }

  let x = gap;
  for(const c of cols){
    // spread a column's leftover height between its cards (up to a point), centered
    const extra = Math.max(0, areaH - c.height);
    const spread = c.cards.length > 1 ? Math.min(extra / (c.cards.length - 1), gap * 2) : 0;
    const total = c.height + spread * (c.cards.length - 1);
    let y = Math.max(0, (areaH - total) / 2);
    for(const card of c.cards){
      // nudges come only from the garden's id, so everyone starts from the same scatter
      const rand = seededRandom(Number(card.id.replace("gardencard-", "")));
      const slackX = c.width - card.offsetWidth;
      card.style.left = x + slackX * rand() * .7 + (rand() - .5) * gap * .5 + "px";
      card.style.top = Math.max(0, y + (rand() - .5) * gap * .6) + "px";
      y += card.offsetHeight + gap + spread;
    }
    x += c.width + gap;
  }
  layoutWidth = x;
  fitCanvas();
}

// the room the cards are laid out in: the window's height less the page's own padding
function baseHeight(){
  const cs = getComputedStyle(indexEl);
  return indexEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
}

// the canvas stretches to hold every card wherever it's been dragged to (by anyone):
// out to the right and down it grows and scrolls, with a margin past the furthest
// card; a card dragged past the left or top edge pushes the canvas over so it can
// still be reached, since a page can't scroll to negative positions
let layoutWidth = 0;
function fitCanvas(){
  const gap = 28;
  const base = baseHeight();
  let minX = 0, minY = 0, maxX = layoutWidth, maxY = base;
  for(const card of gardenListEl.children){
    const m = /translate\(\s*(-?[\d.]+)px(?:,\s*(-?[\d.]+)px)?/.exec(card.style.transform || "");
    const x = card.offsetLeft + (m ? parseFloat(m[1]) : 0);
    const y = card.offsetTop + (m && m[2] ? parseFloat(m[2]) : 0);
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + card.offsetWidth);
    maxY = Math.max(maxY, y + card.offsetHeight);
  }
  gardenListEl.style.marginLeft = minX < 0 ? gap - minX + "px" : "";
  gardenListEl.style.marginTop = minY < 0 ? gap - minY + "px" : "";
  gardenListEl.style.width = maxX + RIGHT_BUFFER + "px";
  // only stretch down for a card that's really out of the window, not a few pixels of scatter
  gardenListEl.style.height = (maxY - base > 40 ? maxY + gap : base) + "px";
}

// playhtml moves cards by setting their transform — live while someone drags, and
// when a move from another visitor arrives — so watch for that
let fitQueued = false;
new MutationObserver(records => {
  if(fitQueued || records.every(r => r.target === gardenListEl)) return;   // the canvas's own width changes don't count
  fitQueued = true;
  setTimeout(() => { fitQueued = false; fitCanvas(); }, 0);   // not requestAnimationFrame: that pauses in a background tab
}).observe(gardenListEl, { subtree: true, attributes: true, attributeFilter: ["style"] });
window.addEventListener("resize", layoutCards);
startMarquee();
marqueeWidth = document.getElementById("tagMarquee").clientWidth;

// the page scrolls sideways, so an ordinary (vertical) mouse wheel scrolls it too
// (unless the page also scrolls down, in which case the wheel keeps its usual job)
indexEl.addEventListener("wheel", e => {
  const canScrollDown = indexEl.scrollHeight > indexEl.clientHeight + 1;   // a card was dragged below the window
  if(!canScrollDown && Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    indexEl.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive: false });

// cursor trail, carried over from the garden (spawnTrailDot in water.js): little
// glyph footprints fade out behind the pointer. there each one is tinted from the
// garden's seed color to its sky; here, with no single garden, every footprint
// gets its own random pair of pinks (hot pink through rose, magenta and blush)
const TRAIL_MIN_DIST = 30;       // spawn a footprint after this many px of movement
const TRAIL_LIFETIME_MS = 1800;  // how long one takes to fade (matches trailFade in mood.css)
const TRAIL_GLYPHS = ["݁˖","˖᯽","જ˚","˚ ༘♡","⋆｡˚","ੈ✩‧","⋆˚❀","༉‧₊"];
let lastTrail = null;
function spawnTrailDot(x, y){
  const hue = 315 + Math.random() * 45;            // magenta (315) through pink to rose (360)
  const hue2 = 315 + Math.random() * 45;
  const lightA = 58 + Math.random() * 14, lightB = 68 + Math.random() * 14;
  const dot = document.createElement("span");
  dot.className = "traildot";
  dot.textContent = TRAIL_GLYPHS[Math.floor(Math.random() * TRAIL_GLYPHS.length)];
  dot.style.position = "fixed";   // the garden's are placed in its field; these are placed on the screen
  dot.style.zIndex = "3";
  dot.style.left = x + "px";
  dot.style.top = y + "px";
  dot.style.backgroundImage = `linear-gradient(135deg, hsl(${hue} 90% ${lightA}%), hsl(${hue2} 85% ${lightB}%))`;
  document.body.appendChild(dot);
  setTimeout(() => dot.remove(), TRAIL_LIFETIME_MS);
}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  document.addEventListener("pointermove", e => {
    if(e.pointerType === "touch") return;
    if(!lastTrail || Math.hypot(e.clientX - lastTrail.x, e.clientY - lastTrail.y) >= TRAIL_MIN_DIST){
      spawnTrailDot(e.clientX, e.clientY);
      lastTrail = { x: e.clientX, y: e.clientY };
    }
  });
}

// every so often, ask who's around and update just the counts
async function refreshHereNow(){
  const here = await fetchHereNow();
  for(const el of gardenListEl.querySelectorAll(".herenow")){
    const id = el.closest(".gardencard").id.replace("gardencard-", "");
    const n = here[id] || 0;
    el.dataset.here = n;
    el.lastElementChild.textContent = hereNowText(n);
  }
}
setInterval(() => { if(document.visibilityState === "visible" && gardenListEl.children.length) refreshHereNow(); }, 20000);

fetchGardens()
  .then(gardens => {
    gardenStatusEl.hidden = true;
    renderGardens(gardens);
    playhtmlReady.then(() => playhtml.setupPlayElements());
  })
  .catch(err => {
    console.warn("couldn't list the gardens:", err);
    gardenStatusEl.textContent = "couldn't reach the gardens ~ try again in a moment";
  });

// same flow as the old in-garden button: ask the Worker for the next number, go there
const newGardenLabel = newGardenBtn.textContent;
newGardenBtn.addEventListener("click", async () => {
  newGardenBtn.disabled = true;
  newGardenBtn.textContent = "planting a new one…";
  try {
    location.href = gardenUrl(await startNewGarden());
  } catch(err) {
    console.warn("couldn't allocate a new garden id:", err);
    newGardenBtn.disabled = false;
    newGardenBtn.textContent = "couldn't start one — try again";
    setTimeout(() => { newGardenBtn.textContent = newGardenLabel; }, 2500);
  }
});
</script>

</body>
</html>
